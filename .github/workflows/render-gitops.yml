# Reusable: deploys to Kubernetes through a GitOps repository. It changes the image
# in one file there with a commit; Argo CD does the rest.
# See docs/render-gitops.md.
name: render-gitops

on:
  workflow_call:
    inputs:
      gitops-repository:
        description: SSH URL, e.g. git@github.com:org/gitops.git or ssh://git@git.example.com:2222/org/gitops.git
        type: string
        required: true
      gitops-branch:
        type: string
        default: main
      gitops-file:
        description: Path of the file to change inside the GitOps repository.
        type: string
        required: true
      target-type:
        description: kustomize-patch or helm-values.
        type: string
        default: kustomize-patch
      annotations-path:
        description: For helm-values, where the pod annotations live in the values.
        type: string
        default: .podAnnotations
      allow-rollback:
        description: Deploy this build even if the file already has a newer one.
        type: boolean
        default: false
      build-env-artifact:
        type: string
        default: build-env
    secrets:
      gitops-deploy-key:
        description: Private SSH key of a deploy key with write access to the GitOps repository.
        required: true
      gitops-known-hosts:
        description: Optional known_hosts lines for the GitOps host. Without it the host key is scanned on first use.
        required: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    concurrency:
      group: render-gitops-${{ inputs.gitops-repository }}-${{ inputs.gitops-file }}
      cancel-in-progress: false
    steps:
      - id: lib
        uses: QwertyUser17/aws-delivery-templates/actions/scripts@main

      - uses: QwertyUser17/aws-delivery-templates/actions/build-env@main
        with:
          artifact: ${{ inputs.build-env-artifact }}

      - env:
          SCRIPTS: ${{ steps.lib.outputs.dir }}
          GITOPS_REPO: ${{ inputs.gitops-repository }}
          GITOPS_BRANCH: ${{ inputs.gitops-branch }}
          GITOPS_FILE: ${{ inputs.gitops-file }}
          TARGET_TYPE: ${{ inputs.target-type }}
          ANNOTATIONS_PATH: ${{ inputs.annotations-path }}
          ALLOW_ROLLBACK: ${{ inputs.allow-rollback }}
          SSH_PRIVATE_KEY: ${{ secrets.gitops-deploy-key }}
          SSH_KNOWN_HOSTS: ${{ secrets.gitops-known-hosts }}
        run: bash "$SCRIPTS/gitops/render.sh"
